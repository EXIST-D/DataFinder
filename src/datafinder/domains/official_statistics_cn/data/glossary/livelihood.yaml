- term_id: cnstat.term.living.01bda4f3
  name_zh: 经营净收入
  topic_ids:
  - cnstat.livelihood
  definition: '指住户或住户成员从事生产经营活动所获得的净收入，是全部经营收入中扣除经营费用、生产性固定资产折旧和生产税之后得到的净收入。计算公式为：

    经营净收入=经营收入-经营费用-生产性固定资产折旧-生产税'
  scope_note: 官方页面里的计算公式是图片，这里没有收录；请到出处页面查看。
