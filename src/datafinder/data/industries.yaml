# Dateno 主题（ISO/DCAT 体系）→ 行业。命中即打标，不需要 min_hits。
topic_map:
  "Economy and finance": [economy, finance]
  "Economy": [economy]
  "Population and society": [population]
  "Society": [population]
  "Government and public sector": [government]
  "Education, culture and sport": [education, culture]
  "Health": [health]
  "Agriculture, fisheries, forestry and food": [agriculture]
  "Energy": [energy]
  "Environment": [environment]
  "Climatology / Meteorology / Atmosphere": [climate]
  "Transport": [transport]
  "Transportation": [transport]
  "Science and technology": [science]
  "Oceans": [ocean]
  "Geoscientific Information": [geology]
  "Inland Waters": [geology]
  "Planning / Cadastre": [housing, geospatial]
  "Imagery / Base Maps / Earth Cover": [geospatial]
  "Elevation": [geospatial]
  "Boundaries": [geospatial]
  "Location": [geospatial]
  "Justice, legal system and public safety": [law]
  "International issues": [statistics]

# Dateno catalog_type → 中文名与检索提示词（让中文查询能命中英文条目）
catalog_types:
  "Open data portal":
    zh: 开放数据门户
    hints: [开放数据, 数据开放, 政府数据, 公共数据, 数据门户, 开放平台]
  "Geoportal":
    zh: 地理信息门户
    hints: [地理信息, 地图, 地理空间, 空间数据, 测绘, gis]
  "Scientific data repository":
    zh: 科学数据仓库
    hints: [科学数据, 科研数据, 数据仓库, 数据中心, 科学数据中心]
  "Indicators catalog":
    zh: 统计指标库
    hints: [统计, 统计数据, 指标, 数据库, 经济数据, 指标库]
  "Microdata catalog":
    zh: 微观数据目录
    hints: [微观数据, 调查数据, 普查数据, 问卷调查, 抽样调查]
  "Machine learning catalog":
    zh: 机器学习数据集目录
    hints: [机器学习, 人工智能, 训练数据, 数据集, 模型]
  "Data marketplace":
    zh: 数据交易平台
    hints: [数据交易, 数据交易所, 数据市场, 数据流通, 数据产品]
  "Data search engine":
    zh: 数据搜索引擎
    hints: [数据搜索, 数据检索, 数据发现]
  "API Catalog":
    zh: API 目录
    hints: [接口, api, 接口目录]
  "Metadata catalog":
    zh: 元数据目录
    hints: [元数据, 数据目录]
  "Datasets list":
    zh: 数据集清单
    hints: [数据集清单, 数据清单, 资源列表]
