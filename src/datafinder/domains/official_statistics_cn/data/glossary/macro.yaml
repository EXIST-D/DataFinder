- term_id: cnstat.term.national_accounts.4b81846f
  name_zh: 服务
  topic_ids:
  - cnstat.macro
  definition: 包括加工服务，维护和维修服务，运输，旅行，建设，保险和养老金服务，金融服务，知识产权使用费，电信、计算机和信息服务，其他商业服务，个人、文化和娱乐服务以及别处未提及的政府服务。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
