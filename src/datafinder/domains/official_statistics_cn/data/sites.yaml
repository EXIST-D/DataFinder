# 官方网站栏目配置：发布机构（国家统计局、省级统计局、部委）及其栏目。
#
# 机构：id（省用 ISO 3166-2 码）、name、region、home；discover_nav: true = 从首页导航按下面的 nav 规则自动发现栏目。
# 栏目：已核实的栏目页（列表页会被逐页收录为条目），可指定条目类型 kind、链接/标题正则、翻页上限 pages、固定主题 topics。
# 站点拒绝/连不上时只保留首页入口并标注原因，换个网络后重跑 `datafinder index build site` 即可补全。
#
# 地址来源：首页来自各机构官网（2026-11-20 访问）；国家统计局栏目于 2026-11-21 逐个访问核实。

pages: 3                      # 未单独指定时，每个栏目最多翻几页

# 首页导航 → 栏目类型。按顺序匹配，先匹配先赢；nav_skip 命中的文字直接忽略（年鉴由年鉴适配器负责）。
nav_skip: "年鉴|新闻|办事|互动|留言|信箱|登录|公开目录|党建|招聘|招考|采购|法规|政策|纪检|机构|简介|领导|党组"
nav:
  - {match: "统计公报|公报", kind: bulletin}
  - {match: "普查", kind: census_product}
  - {match: "数据发布|统计数据|数据查询|统计信息|统计快报|统计月报|月度数据|经济运行|统计分析|数据解读|数据开放|开放数据|主要指标|统计报告|统计资料|数据", kind: report}

publishers:
  # ── 国家统计局 ──
  - id: nbs
    name: 国家统计局
    region: CN
    home: https://www.stats.gov.cn/
    interval: 2.0               # 2026-11-21 实测：1 秒间隔连续翻 70 页后会触发人机验证，2 秒更稳
    columns:
      - {id: release,   title: 数据发布, url: "https://www.stats.gov.cn/sj/zxfb/", kind: report, pages: 70}
      - {id: interpret, title: 数据解读, url: "https://www.stats.gov.cn/sj/sjjd/", kind: report, pages: 70}
      - {id: bulletin-annual, title: 全国年度统计公报, url: "https://www.stats.gov.cn/sj/tjgb/ndtjgb/qgndtjgb/", kind: bulletin, frequency: annual, pages: 6, item_title: "国民经济和社会发展统计公报 {text}", topics: [cnstat.macro]}
      - {id: bulletin-pop,   title: 人口普查公报, url: "https://www.stats.gov.cn/sj/tjgb/rkpcgb/", kind: bulletin, topics: [cnstat.population, cnstat.population.census]}
      - {id: bulletin-econ,  title: 经济普查公报, url: "https://www.stats.gov.cn/sj/tjgb/jjpcgb/", kind: bulletin, topics: [cnstat.macro]}
      - {id: bulletin-agri,  title: 农业普查公报, url: "https://www.stats.gov.cn/sj/tjgb/nypcgb/", kind: bulletin, topics: [cnstat.agriculture]}
      - {id: bulletin-rd,    title: R&D资源清查公报, url: "https://www.stats.gov.cn/sj/tjgb/rdpcgb/", kind: bulletin, topics: [cnstat.innovation]}
      - {id: bulletin-unit,  title: 基本单位普查公报, url: "https://www.stats.gov.cn/sj/tjgb/jbdwpcgb/", kind: bulletin}
      - {id: bulletin-ind,   title: 工业普查公报, url: "https://www.stats.gov.cn/sj/tjgb/gypcgb/", kind: bulletin, topics: [cnstat.industry]}
      - {id: bulletin-svc,   title: 第三产业普查公报, url: "https://www.stats.gov.cn/sj/tjgb/scpcgb/", kind: bulletin}
      - {id: bulletin-other, title: 其他统计公报, url: "https://www.stats.gov.cn/sj/tjgb/qttjgb/", kind: bulletin}
      # 参考资料：说明"数据怎么统计、按什么分类、指标什么口径"，不是数据本身
      - {id: ref-system,    title: 统计制度,   url: "https://www.stats.gov.cn/sj/tjzd/", kind: reference, pages: 4}
      - {id: ref-standard,  title: 统计标准,   url: "https://www.stats.gov.cn/sj/tjbz/gjtjbz/", kind: reference, pages: 5}
      - {id: ref-indicator, title: 指标解释,   url: "https://www.stats.gov.cn/sj/zbjs/", kind: reference, pages: 3}
      # 统计出版物书目（专业年鉴多为书目与简介页、并非免费下载；收录它是为了告诉用户"有哪些卷、去哪里找"）
      - {id: ref-books, title: 统计出版物, url: "https://www.stats.gov.cn/zs/tjwh/tjkw/tjzl/", kind: reference, pages: 16, text: "年鉴|统计摘要|普查|统计资料|统计年报|统计年报", item_title: "{text}（出版物书目）"}

