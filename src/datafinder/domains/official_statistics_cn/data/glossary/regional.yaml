- term_id: cnstat.term.urban_rural_regional.f59be1d7
  name_zh: 城市供热管道长度
  topic_ids:
  - cnstat.regional
  definition: 指从各类热源到热用户建筑物接入口之间的全部蒸汽和热水的管道长度。不包括各类热源厂内部的管道长度。
  source_name: 国家统计局·指标解释·城市、农村和区域发展
