# 统计年鉴与普查资料系列（同一套"zk"目录页模板）：每个系列给出"各版次目录页"的地址模板，供 `datafinder yearbook index` 逐版次抓取目录。
#
# 字段：
#   id        系列标识（全国 cn；省级用 ISO 3166-2 码，如 CN-HE）
#   zh        年鉴名称
#   region    地区码（全国 CN；省 CN-XX）
#   publisher 编纂机构
#   years     [起, 止]，版次年份范围（不存在的版次抓取时按 404 跳过并如实记录）
#   base      版次根地址模板，{year} 会被替换；目录页为 base + toc
#   toc       目录页文件名候选（按顺序尝试）
#   home      年鉴列表页（给人看的入口；没有可抓取的模板时只作导航）
#   crawl     false = 只导航不抓取（页面形态没有可用的解析方式）
#   format    目录页形态：
#               zk    统计出版社模板（left.htm，章节 foldheader）——国家统计局与多数省份
#               tree  树形目录（上海，表格在框架页里按版面拼回）
#               list  只有各版次列表（广东/湖北/云南，整本 zip/rar/在线浏览）
#               json  目录内嵌在页面脚本里（安徽，const contents='[...]'）
#               ml    Word 导出的左侧目录（吉林，njmlc.htm + ../html/1-1.html）
#               yb    查看器目录树（浙江，<a main="./cn/html/1-1 …html">）
#               fp    FrontPage 两级目录（江苏，indexc.htm → nj01.htm → nj01/nj0101.htm）
#   landing / list_urls / follow  见 yearbook/registry.py
#   type      yearbook（默认）| census（普查资料，来源前缀 census.）
#   editions  没有"每年一版"规律时逐版列出 {year, base, label, landing}，代替 years/base
#   topics    整个系列固定的主题（普查资料按卷章难以推断）
#   toc 里的多份目录（网页版/Excel 版）会合并：同一张表的 xls 与网页/图片格式都会登记，xls 排前
#
# 地址来源：2026-11-21 在本机逐省实测（首页/栏目页 → 版次页 → 目录页），每个系列都验证过
# "目录页能解析出表"。站点形态与本清单不同的省（甘肃 412 防护、青海证书）见 README 的覆盖说明。

series:
  - id: cn
    zh: 中国统计年鉴
    region: CN
    publisher: 国家统计局
    years: [2005, 2025]
    base: "https://www.stats.gov.cn/sj/ndsj/{year}/"
    toc: [left.htm, lefte.htm]
    wrapper_html: [2014]          # 2014 版目录里的 zk/html/Z*.HTM 是图片外壳页，同名 .xls 才是表格（抽样 8/8 核验）
    home: https://www.stats.gov.cn/sj/ndsj/

