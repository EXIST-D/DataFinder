# 统计术语同义/相关词表：把研究选题里的常用说法，对应到统计指标与年鉴表格里实际使用的名称。
#
# 用途：检索国家统计局指标与年鉴数据表时的查询扩展。每一项 `词: [相关词…]`，
# 查询里出现"词"时，指标名/表标题里出现"词"或任一"相关词"都算命中该概念。
#
# 加词的原则：
#   1. 只写**统计口径里真实存在的名称**（先在国家统计局发布库/年鉴里确认）；
#   2. 写"概念 → 统计名称"的通用对应，不要为某一个选题单独定制；
#   3. 相关词宁少勿滥：太宽会把无关指标拉进来。

