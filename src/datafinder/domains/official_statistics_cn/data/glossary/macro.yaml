- term_id: cnstat.term.overview.127c72f6
  name_zh: 行政区划
  topic_ids:
  - cnstat.macro
  definition: 指国家对行政区域的划分。根据有关法规规定，我国的行政区域划分如下：（1）全国分为省、自治区、直辖市；（2）省、自治区分为自治州、县、自治县、市；（3）自治州分为县、自治县、市；（4）县、自治县分为乡、民族乡、镇； （5）直辖市和较大的市分为区、县；（6）国家在必要时设立的特别行政区。
  source_name: 国家统计局·指标解释·综合
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897110.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.overview.e0fb969e
  name_zh: 平均增长速度
  topic_ids:
  - cnstat.macro
  definition: '平均增长速度表明社会经济现象在一个较长的时期内逐期平均增长变化的程度，它不能根据各个环比增长速度直接求得，但与平均发展速度之间存在着一定的数量关系：平均增长速度＝平均发展速度－1。

    平均发展速度是一种根据环比发展速度计算的序时平均数，由于各时期对比的基础不同，所以计算平均发展速度不能采用一般的序时平均数的计算方法，计算方法分为水平法和累计法。水平法，又称几何平均法，即将环比发展速度按连乘法用几何平均数公式计算。累计法，也称方程法，根据一段时期内各年发展水平总和与基期水平的关系，列出方程式计算平均发展速度。水平法着重考虑最后一年所达到的发展水平；累计法着重考虑整个时期累计发展水平的总量。

    本《年鉴》内所列的平均增长速度，除固定资产投资用“累计法”计算外，其余均用“水平法”计算。从某年到某年平均增长速度的年份，均不包括基期年在内。如建国四十三年以来的平均增长速度是以1949年为基期计算的，则写为1950-1992年平均增长速度，其余类推。'
  source_name: 国家统计局·指标解释·综合
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897110.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.overview.32a54a9c
  name_zh: 国民经济行业分类
  topic_ids:
  - cnstat.macro
  definition: 自2012年定期报表开始使用新的《国民经济行业分类》（GB/T4754-2011）。该分类是由国家统计局组织修订，国家质量监督检验检疫总局和中国国家标准化管理委员会于2011年4月29日发布。这次修订是在2002年分类标准的基础上，参照联合国《全部经济活动的国际标准产业分类》（ISIC/Rev.4）进行的。修订后的《国民经济行业分类》（GB/T4754-2012）共有门类20个，大类96个，中类432个，小类1094个。
  source_name: 国家统计局·指标解释·综合
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897110.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.overview.edd92468
  name_zh: 企业（单位）登记注册类型
  topic_ids:
  - cnstat.macro
  definition: 是以在工商行政管理机关登记注册的各类企业为划分对象，以工商行政管理部门对企业登记注册的类型为依据，将企业登记注册类型分为内资企业、港澳台商投资企业和外商投资企业三大类。内资企业包括国有企业、集体企业、股份合作企业、联营企业、有限责任公司、股份有限公司、私营企业和其他企业；港澳台商投资企业和外商投资企业分别包括合资经营企业、合作经营企业、独资经营企业和股份有限公司等。对不在工商行政管理部门进行登记注册的行政机关、事业单位和社会团体，主要按其经费来源和管理方式进行划分。
  source_name: 国家统计局·指标解释·综合
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897110.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.overview.c169dbb2
  name_zh: 国有企业
  topic_ids:
  - cnstat.macro
  definition: 指企业全部资产归国家所有，并按《中华人民共和国企业法人登记管理条例》规定登记注册的非公司制的经济组织。不包括有限责任公司中的国有独资公司。
  source_name: 国家统计局·指标解释·综合
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897110.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
