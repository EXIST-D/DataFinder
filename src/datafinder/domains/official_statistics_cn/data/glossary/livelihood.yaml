- term_id: cnstat.term.employment_wages.babb9d1a
  name_zh: 城镇登记失业人员
  topic_ids:
  - cnstat.livelihood
  definition: 指有非农业户口，在一定的劳动年龄内（16周岁至退休年龄），有劳动能力，无业而要求就业，并在当地劳动保障部门进行失业登记的人员。
