- term_id: cnstat.term.resources_environment.039690f5
  name_zh: 危险废物处置量
  topic_ids:
  - cnstat.environment
  definition: 指报告期内企业将危险废物焚烧和用其他改变工业固体废物的物理、化学、生物特性的方法，达到减少或者消除其危险成分的活动，或者将危险废物最终置于符合环境保护规定要求的填埋场的活动中，所消纳危险废物的量。处置量包括处置本单位或委托给外单位处置的量。
  source_name: 国家统计局·指标解释·资源和环境
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897103.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.resources_environment.a145d735
  name_zh: 危险废物贮存量
  topic_ids:
  - cnstat.environment
  definition: 指将危险废物以一定包装方式暂时存放在专设的贮存设施内的量。专设的贮存设施指对危险废物的包装、选址、设计、安全防护、监测和关闭等符合《危险废物贮存污染控制标准》（GB18597-2001）等相关环保法律法规要求，具有防扩散、防流失、防渗漏、防止污染大气和水体措施的设施。
  source_name: 国家统计局·指标解释·资源和环境
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897103.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.resources_environment.1a56a679
  name_zh: 生活垃圾清运量
  topic_ids:
  - cnstat.environment
  definition: 指报告期收集和运送到各生活垃圾处理厂（场）和生活垃圾最终消纳点的生活垃圾数量。生活垃圾指城市日常生活或为城市日常生活提供服务的活动中产生的固体废物以及法律行政规定的视为城市生活垃圾的固体废物。包括：居民生活垃圾、商业垃圾、集市贸易市场垃圾、街道清扫垃圾、公共场所垃圾和机关、学校、厂矿等单位的生活垃圾。
  source_name: 国家统计局·指标解释·资源和环境
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897103.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
