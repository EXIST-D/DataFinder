- term_id: cnstat.term.resources_environment.893f2c16
  name_zh: 危险废物产生量
  topic_ids:
  - cnstat.environment
  definition: 指当年全年调查对象实际产生的危险废物的量。危险废物指列入国家危险废物名录或者根据国家规定的危险废物鉴别标准和鉴别方法认定的，具有爆炸性、易燃性、易氧化性、毒性、腐蚀性、易传染性疾病等危险特性之一的废物。按《国家危险废物名录》（环境保护部、国家发展和改革委员会2008部令第1号）填报。
  source_name: 国家统计局·指标解释·资源和环境
