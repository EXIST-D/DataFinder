- term_id: cnstat.term.national_accounts.9c438548
  name_zh: 二次收入
  topic_ids:
  - cnstat.macro
  definition: 指居民与非居民之间的经常转移，包括现金和实物。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
