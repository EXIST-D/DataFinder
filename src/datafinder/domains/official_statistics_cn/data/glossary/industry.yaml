terms:
- term_id: cnstat.term.industry.96b876e3
  name_zh: 工业
  topic_ids:
  - cnstat.industry
  definition: '指从事自然资源的开采，对采掘品和农产品进行加工和再加工的物质生产部门。具体包括：（1）对自然资源的开采，如采矿、晒盐等（但不包括禽兽捕猎和水产捕捞）；（2）对农副产品的加工、再加工，如粮油加工、食品加工、缫丝、纺织、制革等；（3）对采掘品的加工、再加工，如炼铁、炼钢、化工生产、石油加工、机器制造、木材加工等，以及电力、燃气及水的生产和供应等；（4）对工业品的修理、翻新，如机器设备的修理等。

    工业统计调查单位为工业法人单位。

    工业法人单位指从事工业生产经营活动的法人单位。工业法人单位应同时具备以下条件：①依法成立，有自己的名称、组织机构和场所，能够独立承担民事责任；②独立拥有（或授权）使用资产，承担负债，有权与其他单位签订合同；③具有包括资产负债表在内的帐户，或者能够根据需要编制帐户。'
  source_name: 国家统计局·指标解释·工业
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897098.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.industry.115df82d
  name_zh: 国有控股企业
  topic_ids:
  - cnstat.industry
  definition: '即原来的国有及国有控股企业，根据企业实收资本中国有经济成分的出资人的实际投资情况，或国有经济成分的出资人对企业资产的实际控制、支配程度进行分类。以下情况为国有控股：（1）在企业的全部实收资本中，国有经济成分的出资人拥有的实收资本（股本）所占企业全部实收资本（股本）的比例大于50%的国有绝对控股。（2）在企业的全部实收资本中，国有经济成分的出资人拥有的实收资本（股本）所占比例虽未大于50%，但相对大于其他任何一方经济成分的出资人所占比例的国有相对控股；或者虽不大于其他经济成分，但根据协议规定拥有企业实际控制权的国有协议控股。（3）投资双方各占50%，且未明确由谁绝对控股的企业，若其中一方为国有经济成分的，一律按国有控股处理。

    本篇涉及的企业登记注册类型的解释详见综合篇。'
  source_name: 国家统计局·指标解释·工业
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897098.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.industry.f1719f14
  name_zh: 资产总计
  topic_ids:
  - cnstat.industry
  definition: 指企业过去的交易或者事项形成的、由企业拥有或者控制的、预期会给企业带来经济利益的资源。资产一般按流动性分为流动资产和非流动资产。其中流动资产可分为货币资金、交易性金融资产、应收票据、应收账款、预付款项、其他应收款、存货等；非流动资产可分为长期股权投资、固定资产、无形资产及其他非流动资产等。来源于会计“资产负债表”中“资产总计”项目的期末余额数。
  source_name: 国家统计局·指标解释·工业
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897098.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.industry.5d895e77
  name_zh: 流动资产合计
  topic_ids:
  - cnstat.industry
  definition: 资产满足以下条件之一应归为流动资产：（1）预计在一个正常营业周期中变现、出售或耗用，主要包括存货、应收账款等；（2）主要为交易目的而持有；（3）预计在资产负债表日起一年内（含一年）变现；（4）自资产负债日起一年内，交换其他资产或清偿负债的能力不受限制的现金或现金等价物。包括货币资金、应收票据、应收账款、存货等项目。来源于会计“资产负债表”中“流动资产合计”项目的期末余额数。
  source_name: 国家统计局·指标解释·工业
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897098.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.industry.85ee10e3
  name_zh: 负债合计
  topic_ids:
  - cnstat.industry
  definition: 指企业过去的交易或者事项形成的，预期会导致经济利益流出企业的现时义务。负债一般按偿还期长短分为流动负债和非流动负债。来源于会计“资产负债表”中“负债合计”项目的期末余额数。
  source_name: 国家统计局·指标解释·工业
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897098.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.industry.1c879e22
  name_zh: 应收账款
  topic_ids:
  - cnstat.industry
  definition: 指企业因销售商品、提供劳务等经营活动所形成的债权，包括应向客户收取的货款、增值税款和为客户代垫的运杂费等。来源于会计“资产负债表”中“应收账款”项目的期末余额数。
  source_name: 国家统计局·指标解释·工业
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897098.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.industry.99336c8b
  name_zh: 存货
  topic_ids:
  - cnstat.industry
  definition: 指企业在日常活动中持有以备出售的产成品或商品、处在生产过程中的在产品、在生产过程或提供劳务过程中耗用的材料或物料等，通常包括原材料、在产品、半成品、产成品、商品以及周转材料等。来源于会计“资产负债表”中“存货”项目的期末余额数。
  source_name: 国家统计局·指标解释·工业
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897098.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.industry.30ba2375
  name_zh: 产成品
  topic_ids:
  - cnstat.industry
  definition: 指企业已经完成全部生产过程并验收入库，可以按照合同规定的条件送交订货单位，或者可以作为商品对外销售的产品。来源于会计“产成品”科目的借方余额。
  source_name: 国家统计局·指标解释·工业
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897098.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.industry.ad2fa7ce
  name_zh: 营业收入
  topic_ids:
  - cnstat.industry
  definition: 指企业经营主要业务和其他业务所确认的收入总额。营业收入包括“主营业务收入”和“其他业务收入”。来源于会计“利润表”中“营业收入”项目的本年累计数。
  source_name: 国家统计局·指标解释·工业
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897098.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.industry.33316830
  name_zh: 营业成本
  topic_ids:
  - cnstat.industry
  definition: 指企业经营主要业务和其他业务所发生的成本总额。包括企业（单位）在报告期内从事销售商品、提供劳务等日常活动发生的各种耗费。包括“主营业务成本”和“其他业务成本”。来源于会计“利润表”中“营业成本”项目的本年累计数。
  source_name: 国家统计局·指标解释·工业
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897098.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.industry.611ed46f
  name_zh: 销售费用
  topic_ids:
  - cnstat.industry
  definition: 指企业在销售商品和材料、提供劳务的过程中发生的各种费用，包括保险费、包装费、展览费和广告费、商品维修费、预计产品质量保证损失、运输费、装卸费等以及为销售本企业商品而专设的销售机构（含销售网点、售后服务网点等）的职工薪酬、业务费、折旧费等经营费用。
  source_name: 国家统计局·指标解释·工业
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897098.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.industry.c7950860
  name_zh: 管理费用
  topic_ids:
  - cnstat.industry
  definition: 指企业为组织和管理企业生产经营所发生的费用，包括企业在筹建期间内发生的开办费、董事会和行政管理部门在企业经营管理中发生的，或者应当由企业统一负担的公司经费等。来源于会计“利润表”中“管理费用”项目的本年累计数。
  source_name: 国家统计局·指标解释·工业
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897098.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.industry.b6847ab4
  name_zh: 财务费用
  topic_ids:
  - cnstat.industry
  definition: 指企业为筹集生产经营所需资金等而发生的筹资费用，包括企业生产经营期间发生的利息支出（减利息收入）、汇兑损失（减汇兑收益）以及相关的手续费等。来源于会计“利润表”中“财务费用”项目的本年累计数。
  source_name: 国家统计局·指标解释·工业
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897098.html
  retrieved_at: '2026-11-21'
