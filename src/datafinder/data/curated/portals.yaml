# 精选与补充门户（叠加在 Dateno 注册表之上）
#
# 两种条目：
# 1) 标注：按 `link` 匹配注册表里已有记录，补充中文名、中文说明、行业，并标 featured（精选，排序加权）。
# 2) 新增：`add: true`，注册表里没有的才加。新增前必须自己访问核验过（下方每条新增都注明核验日期）。
#
# 字段：link, name_zh, desc_zh, industries[], featured, [add, name, country, catalog_type, is_national]
# industries 取值见 industries.yaml 的 id。

