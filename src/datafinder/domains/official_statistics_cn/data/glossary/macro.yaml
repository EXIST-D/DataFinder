- term_id: cnstat.term.overview.87dfffce
  name_zh: 私营企业
  topic_ids:
  - cnstat.macro
  definition: 指由自然人投资设立或由自然人控股，以雇佣劳动为基础的营利性经济组织。包括按照《公司法》、《合伙企业法》、《私营企业暂行条例》规定登记注册的私营有限责任公司、私营股份有限公司、私营合伙企业和私营独资企业。
  source_name: 国家统计局·指标解释·综合
