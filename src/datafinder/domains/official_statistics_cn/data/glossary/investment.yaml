  definition: 指报告期收到的境外（包括外国及港澳台地区）资金（包括设备、材料、技术在内）。包括对外借款（外国政府贷款、国际金融组织贷款、出口信贷、外国银行商业贷款、对外发行债券和股票）、外商直接投资、外商其他投资（包括利用外商投资收益在国内进行固定资产再投资活动的资金）。不包括我国自有外汇资金（国家外汇、地方外汇、留成外汇、调剂外汇和国内银行自有资金发放的外汇贷款等）。各类外资按报告期的外汇牌价（中间价）折成人民币计算。
  source_name: 国家统计局·指标解释·固定资产投资
