  verification_status: official_sourced
- term_id: cnstat.term.lodging_catering_tourism.20fc2cd1
  name_zh: 营业额
  topic_ids:
  - cnstat.commerce
  definition: 指住宿和餐饮业单位在经营活动中，因提供服务或销售商品等取得的全部收入（含增值税），收入主要来源于提供客房、餐费服务、商品销售和其他服务，如商务服务。不包括多产业法人企业附营的其他行业产业活动单位的餐费收入、商品销售收入等各项收入。其中，客房收入指住宿和餐饮业单位在经营活动中因提供住宿服务取得的收入（含增值税）。不包括多产业法人企业附营的其他行业产业活动单位的客房收入。餐费收入指本单位为顾客提供就餐服务取得的收入（含增值税）。包括：经烹饪、调制加工后出售的各种食品，如主食、炒菜、凉拌菜等的收入。不包括多产业法人企业附营的其他行业产业活动单位的餐费收入。
  source_name: 国家统计局·指标解释·住宿、餐饮业和旅游
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897094.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.lodging_catering_tourism.19db3a75
  name_zh: 入境游客
  topic_ids:
  - cnstat.commerce
  definition: 指报告期内来中国（大陆）观光、度假、探亲访友、就医疗养、购物、参加会议或从事经济、文化、体育、宗教活动的外国人、港澳台同胞等游客（即入境旅游人数）。统计时，入境游客按每入境一次统计1人次。入境旅游人数包括入境过夜游客和入境一日游游客。
  source_name: 国家统计局·指标解释·住宿、餐饮业和旅游
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897094.html
