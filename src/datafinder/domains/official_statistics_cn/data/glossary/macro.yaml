  name_zh: 股份有限公司
  topic_ids:
  - cnstat.macro
  definition: 指根据《中华人民共和国公司登记管理条例》规定登记注册，其全部注册资本由等额股份构成并通过发行股票筹集资本，股东以其认购的股份对公司承担有限责任，公司以其全部资产对其债务承担责任的经济组织。
  source_name: 国家统计局·指标解释·综合
