  definition: 指房地产开发企业本年进行土地使用权交易活动的最终金额。在土地一级市场，是指土地最后的划拨款、“招拍挂”价格和出让价；在土地二级市场是指土地转让、出租、抵押等最后确定的合同价格。土地成交价款与土地购置面积同口径。
  source_name: 国家统计局·指标解释·房地产
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897093.html
