  definition: 指为社会生产和生活提供基础性、大众性服务的工程和设施，是社会赖以生存和发展的基本条件。包括以下行业投资：铁路运输业、道路运输业、水上运输业、航空运输业、管道运输业、多式联运和运输代理业、装卸搬运业、邮政业、电信广播电视和卫星传输服务业、互联网和相关服务业、水利管理业、生态保护和环境治理业、公共设施管理业。
