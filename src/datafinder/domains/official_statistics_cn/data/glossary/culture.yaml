- term_id: cnstat.term.culture_sports.68ebc135
  name_zh: 国家综合档案馆
  topic_ids:
  - cnstat.culture
  definition: 指由中央或地方各级档案行政管理部门直接管理的，按行政区划或历史时期设置的，收集和管理所辖范围内多种门类档案的档案馆。
  source_name: 国家统计局·指标解释·文化和体育
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897088.html
