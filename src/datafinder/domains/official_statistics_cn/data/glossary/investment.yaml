- term_id: cnstat.term.fixed_investment.15153310
  name_zh: 国家预算资金
  topic_ids:
  - cnstat.investment
  definition: 国家预算包括一般预算、政府性基金预算、国有资本经营预算和社保基金预算。各类预算中用于固定资产投资的资金全部作为国家预算资金填报，其中一般预算中用于固定资产投资的部分包括基建投资、车购税、灾后恢复重建基金和其他财政投资。各级政府债券也应归入国家预算资金。
  source_name: 国家统计局·指标解释·固定资产投资
