- term_id: cnstat.term.real_estate.6efc71df
  name_zh: 本年实际到位资金
  topic_ids:
  - cnstat.investment
  definition: 指房地产开发企业本年实际到位的，可用于房地产开发的各种货币资金。包括国内贷款、利用外资、自筹资金、定金及预收款、个人按揭贷款和其他资金。
  source_name: 国家统计局·指标解释·房地产
