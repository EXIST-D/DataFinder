- term_id: cnstat.term.fixed_investment.24c0104a
  name_zh: 固定资产投资按国民经济行业分
  topic_ids:
  - cnstat.investment
  definition: 指根据其从事的社会经济活动性质对各类单位进行的分类。应根据建设项目建成投产后的主要产品种类或主要用途及社会经济活动种类来划分，不能根据项目单位本身的行业类别来划分。如果项目投产后有几种产品，应根据主要产品来确定行业类别。一般情况下，一个建设项目只能属于一种国民经济行业。
  source_name: 国家统计局·指标解释·固定资产投资
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897101.html
