# 行业分类：用于门户打标签与查询意图识别。
# 打标规则（可复现，非 AI）：在 名称+描述+标签+主题 里统计 keywords 命中数，
# 命中 ≥ min_hits 或命中 Dateno 主题映射（topic_map）即打上该行业。
# 加行业或加关键词直接改本文件。

min_hits: 2

industries:
  - id: statistics
    zh: 统计
    en: Statistics
    keywords: [statistics, statistical, statistic, census, yearbook, national accounts, 统计, 统计局, 普查, 年鉴]
  - id: economy
    zh: 宏观经济
    en: Economy
    keywords: [economy, economic, gdp, inflation, trade, fiscal, macroeconomic, price index, business, 经济, 贸易, 财政, 物价]
  - id: finance
    zh: 金融
