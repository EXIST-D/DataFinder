  name_zh: 人口数
  topic_ids:
  - cnstat.population
  definition: '指一定时点、一定地区范围内有生命的个人总和。

    年度统计的年末人口数指每年12月31日24时的人口数。年度统计的全国人口总数内未包括香港、澳门特别行政区和台湾省以及海外华侨人数。'
  source_name: 国家统计局·指标解释·人口
