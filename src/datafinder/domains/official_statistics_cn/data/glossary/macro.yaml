- term_id: cnstat.term.national_accounts.5f286e22
  name_zh: 国内生产总值
  aliases:
  - GDP
  topic_ids:
  - cnstat.macro
  definition: '指一个国家所有常住单位在一定时期内生产活动的最终成果。国内生产总值有三种表现形态，即价值形态、收入形态和产品形态。从价值形态看，它是所有常住单位在一定时期内生产的全部货物和服务价值与同期投入的全部非固定资产货物和服务价值的差额，即所有常住单位的增加值之和；从收入形态看，它是所有常住单位在一定时期内创造的各项收入之和，包括劳动者报酬、生产税净额、固定资产折旧和营业盈余；从产品形态看，它是所有常住单位在一定时期内最终使用的货物和服务价值与货物和服务净出口价值之和。在实际核算中，国内生产总值有三种计算方法，即生产法、收入法和支出法。三种方法分别从不同的方面反映国内生产总值及其构成。

    对于一个地区来说，称为地区生产总值或地区GDP。'
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.00a6f862
  name_zh: 国民总收入
  aliases:
  - GNI
  topic_ids:
  - cnstat.macro
  definition: 原称国民生产总值（GNP），指一个国家所有常住单位在一定时期内收入初次分配的最终结果。一国常住单位从事生产活动所创造的增加值在初次分配中主要分配给该国的常住单位，但也有一部分以生产税 （扣除生产补贴）、劳动者报酬和财产收入等形式分配给非常住单位；同时，国外生产所创造的增加值也有一部分以生产税 （扣除生产补贴）、劳动者报酬和财产收入等形式分配给该国的常住单位，从而产生了国民总收入的概念。它等于国内生产总值加上来自国外的初次收入分配净额。与国内生产总值不同，国民总收入是个收入概念，而国内生产总值是个生产概念。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.059d839b
  name_zh: 三次产业
  topic_ids:
  - cnstat.macro
  definition: '三次产业的划分是世界上较为常用的产业结构分类，但各国的划分不尽一致。根据《国民经济行业分类》（GB/T 4754—2011）和《三次产业划分规定》，我国的三次产业划分是：

    第一产业是指农、林、牧、渔业（不含农、林、牧、渔服务业）。

    第二产业是指采矿业（不含开采辅助活动），制造业（不含金属制品、机械和设备修理业），电力、热力、燃气及水生产和供应业，建筑业。

    第三产业即服务业，是指除第一产业、第二产业以外的其他行业。'
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.b9400e6e
  name_zh: 劳动者报酬
  topic_ids:
  - cnstat.macro
  definition: 指劳动者从事生产活动应获得的全部报酬，既包括货币形式的报酬，也包括实物形式的报酬。主要包括工资、奖金、津贴和补贴，单位为其员工交纳的社会保险费、补充社会保险费和住房公积金、行政事业单位职工的离退休金、单位为其员工提供的其他各种形式的福利和报酬等。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.f7fdf8b6
  name_zh: 生产税净额
  topic_ids:
  - cnstat.macro
  definition: 指生产税减生产补贴后的差额。其中，生产税指政府对生产单位从事生产、销售和经营活动，以及因从事生产活动使用某些生产要素（如固定资产和土地等）所征收的各种税收、附加费和其他规费。生产税分为产品税和其他生产税，产品税主要有：增值税、消费税、进口关税、出口税等；其他生产税主要有：房产税、车船使用税、城镇土地使用税等。生产补贴则相反，它是政府为影响生产单位的生产、销售及定价等生产活动而对其提供的无偿支付，包括农业生产补贴、政策亏损补贴、进口补贴等。生产补贴作为负生产税处理。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.54e2430d
  name_zh: 固定资产折旧
  topic_ids:
  - cnstat.macro
  definition: 指由于自然退化、正常淘汰或损耗而导致的固定资产价值下降，用以代表固定资产通过生产过程被转移到其产出中的价值。原则上，固定资产折旧应按照固定资产的重置价值计算。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.97c47c07
  name_zh: 营业盈余
  topic_ids:
  - cnstat.macro
  definition: 指常住单位创造的增加值扣除劳动者报酬、生产税净额和固定资产折旧后的余额。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.f62a904b
  name_zh: 支出法国内生产总值
  topic_ids:
  - cnstat.macro
  definition: '是从最终使用的角度反映一个国家（或地区）一定时期内生产活动最终成果的一种方法，包括最终消费支出、资本形成总额及货物和服务净出口三部分。计算公式为：

    支出法国内生产总值=最终消费支出+资本形成总额+货物和服务净出口'
  scope_note: 官方页面里的计算公式是图片，这里没有收录；请到出处页面查看。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.6c257ebe
  name_zh: 最终消费支出
  topic_ids:
  - cnstat.macro
  definition: 指常住单位为满足物质、文化和精神生活的需要，从本国经济领土和国外购买的货物和服务的支出。它不包括非常住单位在本国经济领土内的消费支出。最终消费支出分为居民消费支出和政府消费支出。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.5b09204c
  name_zh: 居民消费支出
  topic_ids:
  - cnstat.macro
  definition: 指常住住户在一定时期内对于货物和服务的全部最终消费支出。居民消费支出除了直接以货币形式购买的货物和服务的消费支出外，还包括以其他方式获得的货物和服务的消费支出，后者称为虚拟消费支出。居民虚拟消费支出主要包括：单位以实物报酬及实物转移的形式提供给劳动者的货物和服务；住户生产用于自身消费的货物（如自产自用的农产品），以及纳入生产核算范围并用于自身消费的服务（如住户的自有住房服务）；银行和保险机构提供的间接计算的金融服务。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.3ebb35db
  name_zh: 政府消费支出
  topic_ids:
  - cnstat.macro
  definition: 指政府部门为全社会提供的公共服务的消费支出和免费或以较低的价格向居民住户提供的货物和服务的净支出，前者等于政府服务的产出价值减去政府单位所获得的经营收入的价值，后者等于政府部门免费或以较低价格向居民住户提供的货物和服务的市场价值减去向住户收取的价值。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.768b9818
  name_zh: 资本形成总额
  topic_ids:
  - cnstat.macro
  definition: 指常住单位在一定时期内获得减去处置的固定资产和存货的净额，包括固定资本形成总额和存货变动两部分。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.164b49f8
  name_zh: 固定资本形成总额
  topic_ids:
  - cnstat.macro
  definition: 指常住单位在一定时期内获得的固定资产减处置的固定资产的价值总额。固定资产是通过生产活动生产出来的，且其使用年限在一年以上、单位价值在规定标准以上的资产，不包括自然资产、耐用消费品、小型工器具。固定资本形成总额包括住宅、其他建筑和构筑物、机器和设备、培育性生物资源、知识产权产品（研发支出、矿藏的勘探、计算机软件）的价值获得减处置。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.0a44a43a
  name_zh: 存货变动
  topic_ids:
  - cnstat.macro
  definition: 指常住单位在一定时期内存货实物量变动的市场价值，即期末价值减期初价值的差额，再扣除当期由于价格变动而产生的持有收益。存货变动可以是正值，也可以是负值，正值表示存货上升，负值表示存货下降。存货包括生产单位购进的原材料、燃料和储备物资等存货，以及生产单位生产的产成品、在制品和半成品等存货。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.e790dac0
  name_zh: 货物和服务净出口
  topic_ids:
  - cnstat.macro
  definition: 指货物和服务出口减货物和服务进口的差额。出口包括常住单位向非常住单位出售或无偿转让的各种货物和服务的价值；进口包括常住单位从非常住单位购买或无偿得到的各种货物和服务的价值。货物的出口和进口都按离岸价格计算。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.826f55ab
  name_zh: 机构单位
  topic_ids:
  - cnstat.macro
  definition: 指能够以自己的名义拥有资产和承担负债，能够独立地从事经济活动并与其他主体进行交易的经济主体。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.f2a6a000
  name_zh: 机构部门
  topic_ids:
  - cnstat.macro
  definition: 将相同性质的机构单位归并在一起，就形成机构部门。资金流量核算将常住机构单位划分为以下四个机构部门：非金融企业部门、金融机构部门、政府部门、住户部门。与常住单位发生交易的非常住单位称为国外，在资金流量核算中也视同机构部门。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.d535ecfd
  name_zh: 非金融企业与非金融企业部门
  topic_ids:
  - cnstat.macro
  definition: 非金融企业指主要从事市场性货物生产或提供非金融市场性服务的常住企业，它主要包括从事上述活动的各类法人企业。所有非金融企业组成非金融企业部门。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.4b4ef2b7
  name_zh: 金融机构与金融机构部门
  topic_ids:
  - cnstat.macro
  definition: 金融机构指主要从事金融媒介及与金融媒介密切相关的辅助金融活动的常住机构单位，包括从事货币金融服务、资本市场服务、保险服务、其他金融服务等活动的法人单位。所有金融机构组成金融机构部门。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.fa4e0ef6
  name_zh: 政府机构与政府部门
  topic_ids:
  - cnstat.macro
  definition: 政府机构指在设定区域内对其他机构单位拥有立法、司法或行政权的法律实体及其附属单位。政府机构的主要职能是利用征税和其他方式获得的资金向社会和公众提供货物和服务；通过转移支付，对社会收入和财产进行再分配；从事非市场性生产。它主要包括各级党政机关、群众团体、事业单位、基层群众的自治组织等。所有政府机构组成政府部门。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.15fe4c5a
  name_zh: 住户与住户部门
  topic_ids:
  - cnstat.macro
  definition: 住户指共享同一生活设施，共同使用部分或全部收入和财产，共同消费住房、食品和其他消费品与服务的常住个人或个人群体。所有住户组成住户部门。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.6630a236
  name_zh: 非常住单位与国外
  topic_ids:
  - cnstat.macro
  definition: 所有不具有常住性的机构单位都是非常住单位。与我国常住单位发生交易的所有非常住单位称为国外。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.ef3ebced
  name_zh: 初次分配总收入
  topic_ids:
  - cnstat.macro
  definition: 收入初次分配是生产活动创造的价值在参与生产活动的生产要素所有者及政府之间的分配。生产活动的最终成果是增加值。生产要素主要包括劳动力、资本、自然资源。劳动力所有者因提供劳动而获得劳动报酬；资本的所有者因提供资本而获得不同形式的收入，如借贷资本所有者获得利息收入；股权所有者获得红利或参与利润分配；自然资源所有者因出让自然资源使用权而获得地租；政府因国家管理需要对生产活动或生产要素征收生产税同时也因扶持有关生产活动而支付生产补贴。初次分配的结果形成各个机构部门的初次分配总收入。各部门的初次分配总收入之和就等于国民总收入，亦即国民生产总值。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.31c7e531
  name_zh: 经常转移
  topic_ids:
  - cnstat.macro
  definition: 转移是一个机构单位向另一个机构单位提供货物、服务或资产，但又不从后者获取任何直接对应回报的一种交易。经常转移指交易的一方或双方都不涉及获得或处置资产（除存货和现金外）的转移。其形式有所得税、财产税等经常税、社会保险缴款、社会保险福利、社会补助和其他经常转移。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.5000d15e
  name_zh: 可支配总收入
  topic_ids:
  - cnstat.macro
  definition: 在初次分配总收入的基础上，通过经常转移的形式对初次分配总收入进行再次分配。再分配的结果形成各个机构部门的可支配总收入。各部门的可支配总收入之和称为国民可支配总收入。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.2c903617
  name_zh: 总储蓄
  topic_ids:
  - cnstat.macro
  definition: 指可支配总收入用于最终消费后的余额。各部门的总储蓄之和称为国民总储蓄。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.cff6e64f
  name_zh: 资本转移
  topic_ids:
  - cnstat.macro
  definition: 指交易的一方或双方涉及获得或处置资产（除存货和现金外）的转移。资本转移包括资本税、投资性补助和其他资本转移。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.a53be2f4
  name_zh: 净金融投资
  topic_ids:
  - cnstat.macro
  definition: 它反映各机构部门或经济总体非金融投资过程中资金富余或短缺的状况。从非金融交易角度看，它是指总储蓄加资本转移收入减资本转移支出减非金融投资后的差额。从金融交易角度看，它是金融资产的增加额减金融负债的增加额之后的差额。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.de60dd41
  name_zh: 通货
  topic_ids:
  - cnstat.macro
  definition: 指以现金形式存在于市场流通领域中的货币，包括纸币和硬币。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.292ece79
  name_zh: 存款
  topic_ids:
  - cnstat.macro
  definition: 以各种形式存在存款类金融机构的存款，包括活期存款、定期存款、财政存款、外汇存款和其他存款等。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.daf8b929
  name_zh: 贷款
  topic_ids:
  - cnstat.macro
