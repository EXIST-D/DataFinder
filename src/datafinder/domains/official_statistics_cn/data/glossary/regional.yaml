terms:
- term_id: cnstat.term.urban_rural_regional.ed0c465e
  name_zh: 供水综合生产能力
  topic_ids:
  - cnstat.regional
  definition: 指按供水设施取水、净化、送水、出厂输水干管等环节设计能力计算的综合生产能力。包括在原设计能力的基础上，经挖、革、改增加的生产能力。计算时，以四个环节中最薄弱的环节为主确定能力。
  source_name: 国家统计局·指标解释·城市、农村和区域发展
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897086.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.urban_rural_regional.3052b22c
  name_zh: 供水管道长度
  topic_ids:
  - cnstat.regional
  definition: 指从送水泵至用户水表之间所有管道的长度。不包括新安装尚未使用、水厂内以及用户建筑物内的管道。
  source_name: 国家统计局·指标解释·城市、农村和区域发展
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897086.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.urban_rural_regional.b23abbfb
  name_zh: 城市供水总量
  topic_ids:
  - cnstat.regional
  definition: 指报告期供水企业（单位）供出的全部水量。包括有效供水量和漏损水量。
  source_name: 国家统计局·指标解释·城市、农村和区域发展
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897086.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.urban_rural_regional.8bd6f424
  name_zh: 生活用水
  topic_ids:
  - cnstat.regional
  definition: 包括公共服务用水和居民家庭用水。公共服务用水指为城区社会公共生活服务的用水。包括行政事业单位、部队营区和公共设施服务、批发零售业、住宿餐饮业以及社会服务业等单位的用水。居民家庭用水指城市范围内所有居民家庭的日常生活用水。包括城市居民、农民家庭、公共供水站用水。
  source_name: 国家统计局·指标解释·城市、农村和区域发展
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897086.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.urban_rural_regional.7d2d8e91
  name_zh: 生产用水
  topic_ids:
  - cnstat.regional
  definition: 指在城区范围内生产、运营的农、林、牧、渔业、工业、建筑业、交通运输业等单位在生产、运营过程中的用水。
  source_name: 国家统计局·指标解释·城市、农村和区域发展
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897086.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.urban_rural_regional.ae080b87
  name_zh: 用水普及率
  topic_ids:
  - cnstat.regional
  definition: 指报告期末城区用水人口数与城市人口总数的比率。计算公式：
  scope_note: 官方页面里的计算公式是图片，这里没有收录；请到出处页面查看。
  source_name: 国家统计局·指标解释·城市、农村和区域发展
