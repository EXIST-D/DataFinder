- term_id: cnstat.term.real_estate.efdb5b8d
  name_zh: 房屋施工面积
  topic_ids:
  - cnstat.investment
  definition: 指房地产开发企业本年施工的全部房屋建筑面积。包括本年新开工的房屋建筑面积、上年跨入本年继续施工的房屋建筑面积、上年停缓建在本年恢复施工的房屋建筑面积、本年竣工的房屋建筑面积以及本年施工后又停缓建的房屋建筑面积。多层建筑应填各层建筑面积之和。
  source_name: 国家统计局·指标解释·房地产
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897093.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.real_estate.9f924b96
  name_zh: 房屋新开工面积
  topic_ids:
  - cnstat.investment
  definition: 指房地产开发企业本年新开工建设的房屋建筑面积，以单位工程为核算对象。不包括在上年开工跨入本年继续施工的房屋建筑面积和上年停缓建而在本年恢复施工的房屋建筑面积。房屋的开工应以房屋正式开始破土刨槽（地基处理或打永久桩）的日期为准。房屋新开工面积指整栋房屋的全部建筑面积，不能分割计算。
  source_name: 国家统计局·指标解释·房地产
