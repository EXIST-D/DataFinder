- term_id: cnstat.term.overview.567da4c2
  name_zh: 有限责任公司
  topic_ids:
  - cnstat.macro
  definition: 指根据《中华人民共和国公司登记管理条例》规定登记注册，由两个以上、五十个以下的股东共同出资，每个股东以其所认缴的出资额对公司承担有限责任，公司以其全部资产对其债务承担责任的经济组织。有限责任公司包括国有独资公司以及其他有限责任公司。
  source_name: 国家统计局·指标解释·综合
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897110.html
