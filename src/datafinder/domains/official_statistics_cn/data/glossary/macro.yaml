- term_id: cnstat.term.national_accounts.425551e9
  name_zh: 中央银行贷款
  topic_ids:
  - cnstat.macro
  definition: 指中央银行向各金融机构的贷款。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
