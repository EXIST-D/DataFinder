- term_id: cnstat.term.overview.3a5a9686
  name_zh: 其他企业
  topic_ids:
  - cnstat.macro
  definition: '指上述企业之外的其他内资经济组织。

    合资经营企业（港或澳、台资） 指港澳台地区投资者与内地企业依照《中华人民共和国中外合资经营企业法》及有关法律的规定，按合同规定的比例投资设立、分享利润和分担风险的企业。

    合作经营企业（港或澳、台资） 指港澳台地区投资者与内地企业依照《中华人民共和国中外合作经营企业法》及有关法律的规定，依照合作合同的约定进行投资或提供条件设立、分配利润和分担风险的企业。'
  source_name: 国家统计局·指标解释·综合
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897110.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
