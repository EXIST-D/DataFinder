  definition: 包括货物和服务、初次收入和二次收入。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.ef0f9548
  name_zh: 货物
  topic_ids:
  - cnstat.macro
  definition: 指经济所有权在我国居民与非居民之间发生转移的货物交易。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
