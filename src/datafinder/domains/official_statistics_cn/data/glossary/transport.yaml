terms:
- term_id: cnstat.term.transport_post_software.f52f9cd3
  name_zh: 铁路营业里程
  topic_ids:
  - cnstat.transport
  definition: 又称营业长度，指投入客货运输营业或临时营业的线路长度。
  source_name: 国家统计局·指标解释·运输、邮电和软件业
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897095.html
