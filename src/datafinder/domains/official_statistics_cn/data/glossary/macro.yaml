  name_zh: 港澳台商投资股份有限公司
  topic_ids:
  - cnstat.macro
  definition: 指根据国家有关规定，经原外经贸部依法批准设立，其中港、澳、台商的股本占公司注册资本的比例达25%以上的股份有限公司。凡其中港、澳、台商的股本占公司注册资本的比例小于25%的，属于内资企业中的股份有限公司。
  source_name: 国家统计局·指标解释·综合
