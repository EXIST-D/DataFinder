- term_id: cnstat.term.urban_rural_regional.654079b6
  name_zh: 城市供热总量
  topic_ids:
  - cnstat.regional
  definition: 指在报告期供热企业（单位）向城市热用户输送全部蒸汽和热水的总热量。
  source_name: 国家统计局·指标解释·城市、农村和区域发展
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897086.html
