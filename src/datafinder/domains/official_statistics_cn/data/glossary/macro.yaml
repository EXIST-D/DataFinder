  verification_status: official_sourced
- term_id: cnstat.term.overview.08eb5d7f
  name_zh: 联营企业
  topic_ids:
  - cnstat.macro
  definition: 指两个及两个以上相同或不同所有制性质的企业法人或事业单位法人，按自愿、平等、互利的原则，共同投资组成的经济组织。联营企业包括国有联营企业、集体联营企业、国有与集体联营企业和其他联营企业。
