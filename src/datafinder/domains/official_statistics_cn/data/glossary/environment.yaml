  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.resources_environment.099def2e
  name_zh: 危险废物综合利用量
  topic_ids:
  - cnstat.environment
  definition: 指当年全年调查对象从危险废物中提取物质作为原材料或者燃料的活动中消纳危险废物的量。包括本单位利用或委托、提供给外单位利用的量。
  source_name: 国家统计局·指标解释·资源和环境
