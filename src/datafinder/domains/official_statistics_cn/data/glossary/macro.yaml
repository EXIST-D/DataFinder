- term_id: cnstat.term.national_accounts.8833bb50
  name_zh: 资本账户
  topic_ids:
  - cnstat.macro
  definition: 指居民与非居民之间的资本转移，以及居民与非居民之间非生产非金融资产的取得和处置。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
