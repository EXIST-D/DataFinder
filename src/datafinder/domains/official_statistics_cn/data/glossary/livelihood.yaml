- term_id: cnstat.term.employment_wages.1a9916f6
  name_zh: 城镇登记失业率
  topic_ids:
  - cnstat.livelihood
  definition: 城镇登记失业人员与城镇单位就业人员（扣除使用的农村劳动力、聘用的离退休人员、港澳台及外方人员）、城镇单位中的不在岗职工、城镇私营业主、个体户主、城镇私营企业和个体就业人员、城镇登记失业人员之和的比。
  source_name: 国家统计局·指标解释·就业和工资
