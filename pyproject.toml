[project]
name = "datafinder"
version = "0.0.1"
description = "中文优先的找数入口：用关键词或自然语言，快速找到各行业的数据门户、数据集、数据表与下载/API 地址。"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "EXIST-D" }]
keywords = ["data discovery", "open data", "official statistics", "MCP", "中文"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    "dataseek>=0.10,<0.11",
    "duckdb>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.0,<3",
    "opencc-python-reimplemented>=0.1.7",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# 本地网页与 MCP 在后续里程碑加入
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/EXIST-D/DataFinder"
Issues = "https://github.com/EXIST-D/DataFinder/issues"

[project.scripts]
# 注意：不使用 `df` 作为命令名，它会遮蔽系统自带的 /bin/df
datafinder = "datafinder.cli:main"
dfd = "datafinder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datafinder"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# 中文注释按双倍宽度计算，E501 误报多；代码换行交给 `ruff format`
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的 Depends/Query 作默认参数是标准写法
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
