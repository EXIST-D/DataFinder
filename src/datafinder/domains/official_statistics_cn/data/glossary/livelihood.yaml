- term_id: cnstat.term.living.f3ffa476
  name_zh: 工资性收入
  topic_ids:
  - cnstat.livelihood
  definition: 指就业人员通过各种途径得到的全部劳动报酬和各种福利，包括受雇于单位或个人、从事各种自由职业、兼职和零星劳动得到的全部劳动报酬和福利。
  source_name: 国家统计局·指标解释·人民生活
