  definition: 指报告期内在中国（大陆）观光游览、度假、探亲访友、就医疗养、购物、参加会议或从事经济、文化、体育、宗教活动的中国（大陆）居民人数，其出游的目的不是通过所从事的活动谋取报酬。统计时，国内游客按每出游一次统计1人次。
