- term_id: cnstat.term.population.2d413295
  name_zh: 总抚养比
  topic_ids:
  - cnstat.population
  definition: '也称总负担系数。指人口总体中非劳动年龄人口数与劳动年龄人口数之比。通常用百分比表示。说明每100名劳动年龄人口大致要负担多少名非劳动年龄人口。用于从人口角度反映人口与经济发展的基本关系。计算公式为：

    其中：GDR为总抚养比；

    P0~14为0～14岁少年儿童人口数；

    P65+为65岁及65岁以上的老年人口数；

    P15~64为15～64岁劳动年龄人口数。'
  scope_note: 官方页面里的计算公式是图片，这里没有收录；请到出处页面查看。
  source_name: 国家统计局·指标解释·人口
