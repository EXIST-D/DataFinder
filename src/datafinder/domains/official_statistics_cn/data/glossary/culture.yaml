- term_id: cnstat.term.culture_sports.e39059c0
  name_zh: 规模以上文化制造业企业
  topic_ids:
  - cnstat.culture
  definition: 指《文化及相关产业分类（2018）》所规定行业范围内，年主营业务收入在2000万元及以上的工业企业法人。
  source_name: 国家统计局·指标解释·文化和体育
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897088.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.culture_sports.ce7c599e
  name_zh: 限额以上文化批发和零售业企业
  topic_ids:
  - cnstat.culture
  definition: 指《文化及相关产业分类（2018）》所规定行业范围内，年主营业务收入在2000万元及以上的批发业企业法人和年主营业务收入在500万元及以上的零售业企业法人。
  source_name: 国家统计局·指标解释·文化和体育
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897088.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.culture_sports.12bd19e9
  name_zh: 规模以上文化服务业企业
  topic_ids:
  - cnstat.culture
  definition: 指《文化及相关产业分类（2018）》所规定行业范围内，从业人员在50人及以上或年营业收入在1000万元及以上的服务业企业法人，其中文化和娱乐业的年营业收入在500万元及以上。
  source_name: 国家统计局·指标解释·文化和体育
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897088.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
