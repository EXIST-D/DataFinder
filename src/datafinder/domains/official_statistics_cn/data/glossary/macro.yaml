- term_id: cnstat.term.national_accounts.eda9fe3b
  name_zh: 初次收入
  topic_ids:
  - cnstat.macro
  definition: 指由于提供劳务、金融资产和出租自然资源而获得的回报，包括雇员报酬、投资收益和其他初次收入三部分。
  source_name: 国家统计局·指标解释·国民经济核算
