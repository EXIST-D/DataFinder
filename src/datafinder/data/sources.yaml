# 数据集来源注册表。新增来源：
#   - 已有协议（ckan）的门户：加一行；
#   - 全新接口：写 sources/xxx.py（实现 search），在 registry.py 的 PROTOCOLS 里登记，再加一行。
# 顺序即来源优先级（合并去重时，先出现的来源字段优先）。
#
# 字段：id, title, protocol, status(active|experimental|disabled), official, langs, base_url, options
#   options.dsk_id：该来源在 Dataseek 里的 id，用于告诉 Dataseek 不要重复搜它。

# ── 中国 ──
- id: nbs
  title: 国家统计局
  protocol: nbs
  status: experimental        # 新版发布库 2026-03 上线、试运行、无正式文档
  official: true
  langs: [zh]

# ── 高质量英文 / 国际 ──
- id: zenodo
  title: Zenodo
  protocol: zenodo
  options: {dsk_id: zenodo}

- id: datacite
  title: DataCite
  protocol: datacite          # 覆盖上千个仓库，含中国科学数据银行 ScienceDB（10.57760）
  options: {dsk_id: datacite}

- id: hdx
  title: 人道主义数据交换 HDX
  protocol: ckan
  base_url: https://data.humdata.org/api/3/action
  options:
    dsk_id: hdx
    url_pattern: "https://data.humdata.org/dataset/{name}"

- id: data-gov-uk
  title: 英国政府数据 data.gov.uk
  protocol: ckan
  base_url: https://ckan.publishing.service.gov.uk/api/action   # data.gov.uk 会重定向到此
  options:
    dsk_id: data-gov-uk
    url_pattern: "https://www.data.gov.uk/dataset/{id}/{name}"

- id: open-canada
  title: 加拿大开放政府
  protocol: ckan
  base_url: https://open.canada.ca/data/api/action
  options:
    dsk_id: open-canada
    url_pattern: "https://open.canada.ca/data/en/dataset/{id}"

- id: data-gov-au
  title: 澳大利亚政府数据
  protocol: ckan
  base_url: https://data.gov.au/data/api/3/action
  options:
    dsk_id: data-gov-au
    url_pattern: "https://data.gov.au/data/dataset/{name}"

# ── 长尾桥接：约 60 个国际来源；自动排除上面已自研的来源 ──
- id: dataseek
  title: Dataseek（长尾来源）
  protocol: dataseek
