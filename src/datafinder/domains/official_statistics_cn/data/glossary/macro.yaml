- term_id: cnstat.term.overview.ab31f24e
  name_zh: 股份合作企业
  topic_ids:
  - cnstat.macro
  definition: 指以合作制为基础，由企业职工共同出资入股，吸收一定比例的社会资产投资组建，实行自主经营，自负盈亏，共同劳动，民主管理，按劳分配与按股分红相结合的一种集体经济组织。
  source_name: 国家统计局·指标解释·综合
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897110.html
