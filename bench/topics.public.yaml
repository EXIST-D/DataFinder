# 公开来源选题集：题目来自公开的评测集/赛事/真实用户问题，**不是我们自己为系统量身写的**。
# 写下这些题和期望时没有看过检索结果；跑出的第一遍成绩如实记录，之后不拿它调词表/排序/规则
# （发现缺口可以补数据源，但补完要换一批新题再评估）。
#
# 每题的 source 标明出处与改写程度：
#   public   公开题目原样（或仅翻译/提炼），出处见 ref
#   adapted  借用公开评测集的"题型"改写成中国官方统计场景（原题是日本/美国的）
#   authored 我们补写的，用来覆盖公开题没触及的子模块（统计公报、普查、部委、省统计局）——这类题不算"公开题"
#
# 期望的写法同 topics.yaml：每类下的每一项是"任一关键词出现在该类结果的文本里即算命中"；
# documents = 公报与数据发布（统计公报、月度/季度发布、解读），tables 含年鉴表与普查数据表。
#
# 出处：
#   [CT2C] CT2C-QA（ACM MM 2024，arXiv:2410.21414）：取自国家统计局网页的中文问答集，9981 条
#   [SMC]  全国大学生统计建模大赛 2025（第十一届）获奖论文选题（中国统计出版社，ISBN 978-7-5230-0987-1）
#   [NTCIR] NTCIR-15/16 Data Search：面向政府统计数据的公开检索评测，题目来自真实用户提问（日本 e-Stat / 美国 Data.gov）

topics:
  # ───────── [CT2C] 国家统计局网页问答：该找到对应的数据发布 ─────────
  - id: ct2c-mining-profit
    source: public
    ref: "CT2C-QA 示例：2024年1—2月份采矿业利润总额是多少？"
    topic: 2024年1—2月份采矿业利润总额
    expect:
      portals: [国家统计局]
      documents: [[工业企业利润]]
      indicators: [[利润总额, 利润]]

  - id: ct2c-culture-industry
    source: public
    ref: "CT2C-QA 示例：2021年全国文化及相关产业增加值是多少？"
    topic: 2021年全国文化及相关产业增加值
    expect:
      portals: [国家统计局]
      documents: [[文化及相关产业]]

  - id: ct2c-power-generation
    source: public
    ref: "CT2C-QA 示例：2022年11月发电量同比增长率"
    topic: 2022年11月规模以上工业发电量同比增长
    expect:
      portals: [国家统计局, 国家能源局]
      documents: [[能源生产]]
      indicators: [[发电量]]

  # ───────── [SMC] 统计建模大赛 2025 获奖选题 ─────────
  - id: smc-county-common-prosperity
