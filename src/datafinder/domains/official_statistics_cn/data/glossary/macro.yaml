- term_id: cnstat.term.national_accounts.7f4c5f97
  name_zh: 金融账户
  topic_ids:
  - cnstat.macro
  definition: 指发生在居民与非居民之间、涉及金融资产与负债的各类交易。金融账户细分为非储备性质的金融账户和国际储备资产。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.b9321657
  name_zh: 直接投资
  topic_ids:
  - cnstat.macro
  definition: 以投资者寻求在本国以外运行企业获取有效发言权为目的的投资，包括直接投资资产和直接投资负债两部分。相关投资工具可划分为股权和关联企业债务。股权包括股权和投资基金份额，以及再投资收益。关联企业债务包括关联企业间可流通和不可流通的债权和债务。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.a357969d
  name_zh: 证券投资
  topic_ids:
  - cnstat.macro
  definition: 包括证券投资资产和证券投资负债，相关投资工具可划分为股权和债券。股权包括股权和投资基金份额，记录在证券投资项下的股权和投资基金份额均应可流通（可交易）。股权通常以股份、股票、参股、存托凭证或类似单据作为凭证。投资基金份额指投资者持有的共同基金等集合投资产品的份额。债券指可流通的债务工具，是证明其持有人（债权人）有权在未来某个（些）时点向其发行人（债务人）收回本金或收取利息的凭证，包括可转让存单、商业票据、公司债券、有资产担保的证券、货币市场工具以及通常在金融市场上交易的类似工具。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.1fb164a4
  name_zh: 金融衍生工具
  topic_ids:
  - cnstat.macro
  definition: 又称金融衍生工具和雇员认股权，用于记录我国居民与非居民金融衍生工具和雇员认股权交易情况。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.8585af98
  name_zh: 其他投资
  topic_ids:
  - cnstat.macro
  definition: 除直接投资、证券投资、金融衍生工具和储备资产外，居民与非居民之间的其他金融交易。包括其他股权、货币和存款、贷款、保险和养老金、贸易信贷和其他。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.national_accounts.9e8387d3
  name_zh: 净误差与遗漏
  topic_ids:
  - cnstat.macro
  definition: 国际收支平衡表采用复式记账法，由于统计资料来源和时点不同等原因，会形成经常账户与资本和金融账户不平衡，形成统计残差项，称为净误差与遗漏。
  source_name: 国家统计局·指标解释·国民经济核算
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html
