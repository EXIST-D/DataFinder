# 地区词表：中文名/别名 → ISO 代码。用于识别查询里的地点、给门户补中文检索词。
# 省份 ISO 代码与 Dateno 注册表的 subregion.id 一致（如 CN-GD）。

provinces:
  CN-BJ: {zh: 北京, aliases: [北京市]}
  CN-TJ: {zh: 天津, aliases: [天津市]}
  CN-HE: {zh: 河北, aliases: [河北省]}
  CN-SX: {zh: 山西, aliases: [山西省]}
  CN-NM: {zh: 内蒙古, aliases: [内蒙古自治区]}
