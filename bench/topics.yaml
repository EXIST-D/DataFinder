# 真实选题验收集：每条是一个真实的论文/分析选题，写明"找数方案应该能找到什么"。
#
# 运行：datafinder bench topics            （只读本机门户库、指标索引、年鉴目录，不联网）
#
# expect 下三类，每类是一个列表；列表里每一项是"一条期望"：
#   - 写成字符串 = 命中该关键词即通过
#   - 写成列表   = 任一关键词命中即通过（同义说法）
# 检查范围就是找数方案里用户/助手实际看到的条目（指标：名称+分类路径；门户：名称；年鉴：表标题+章节）。
#
# 写期望的原则：
#   1. 只写**确实存在**的东西（先在国家统计局/年鉴里确认有，再写进来），否则失败不代表检索有问题；
#   2. 同义说法放在同一项里，别把"检索措辞"当成失败；
#   3. 发现真实缺口时，保留期望并在 docs 的测试方案里记录原因，而不是删掉。

