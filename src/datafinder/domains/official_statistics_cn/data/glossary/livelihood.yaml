- term_id: cnstat.term.living.14c805f9
  name_zh: 转移性收入
  topic_ids:
  - cnstat.livelihood
  definition: 指国家、单位、社会团体对住户的各种经常性转移支付和住户之间的经常性收入转移。包括养老金或退休金、社会救济和补助、政策性生产补贴、政策性生活补贴、救灾款、经常性捐赠和赔偿、报销医疗费、住户之间的赡养收入，本住户非常住成员寄回带回的收入等。转移性收入不包括住户之间的实物馈赠。
  source_name: 国家统计局·指标解释·人民生活
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897105.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.living.15e559a1
  name_zh: 转移性支出
  topic_ids:
  - cnstat.livelihood
  definition: '指调查户对国家、单位、住户或个人的经常性或义务性转移支付。包括缴纳的税款、各项社会保障支出、赡养支出、经常性捐赠和赔偿支出以及其他经常转移支出等。

    根据住户收支与生活状况调查，分城镇和农村的居民人均可支配收入等数据的覆盖人群主要变化：一是计算城镇居民人均可支配收入时分母包括了在城镇地区常住的农民工，计算农村居民人均可支配收入时分母不包括在城镇地区常住的农民工；二是由本户供养的在外大学生视为常住人口。

    二、居民消费支出

    居民消费支出是指居民用于满足家庭日常生活消费需要的全部支出，既包括现金消费支出，也包括实物消费支出。消费支出可划分为食品烟酒、衣着、居住、生活用品及服务、交通通信、教育文化娱乐、医疗保健以及其他用品及服务八大类。'
  source_name: 国家统计局·指标解释·人民生活
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897105.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
