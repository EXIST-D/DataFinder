# 中文找数基准问句（14 条，覆盖人口/经济/环境/气象/农业/卫生/金融/地理/房产/AI/交通）。
# intent 是标注时的相关性口径：
#   2 = 主题完全吻合（且问句暗示中国/中文时，数据与中国有关或是中文资源）
#   1 = 主题吻合但地区不同，或只部分吻合
#   0 = 无关
- {id: q01, query: 中国各省近十年人口 GDP 城镇化率, intent: 中国分省的人口、GDP、城镇化率数据（面板或时间序列最佳）}
- {id: q02, query: 国内生产总值, intent: GDP 数据；中国的最佳，其他国家的 GDP 为部分相关}
- {id: q03, query: 人口普查, intent: 人口普查数据；中国人口普查最佳，其他国家普查为部分相关}
- {id: q04, query: 空气质量 PM2.5, intent: 空气质量或 PM2.5 的监测/估算数据；中国的最佳}
- {id: q05, query: 中国气象站 逐日 气温 降水, intent: 中国气象站点的逐日气温/降水数据}
- {id: q06, query: 粮食产量 农作物, intent: 粮食或农作物产量数据；中国的最佳}
- {id: q07, query: 新冠疫情数据, intent: COVID-19 病例/疫情统计数据}
- {id: q08, query: 居民消费价格指数 CPI, intent: 消费者价格指数数据；中国的最佳}
- {id: q09, query: 碳排放 二氧化碳, intent: 二氧化碳/碳排放数据；中国的最佳}
- {id: q10, query: 土地利用 遥感, intent: 土地利用/土地覆盖遥感数据；中国范围的最佳}
- {id: q11, query: 城市房价, intent: 城市住房价格数据；中国城市的最佳}
- {id: q12, query: 中文 自然语言处理 语料, intent: 中文自然语言处理语料/数据集}
- {id: q13, query: 失业率, intent: 失业率数据；中国的最佳}
- {id: q14, query: 铁路 高铁 客运, intent: 铁路/高铁客运量或运营数据；中国的最佳}
