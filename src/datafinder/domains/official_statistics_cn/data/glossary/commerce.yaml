- term_id: cnstat.term.lodging_catering_tourism.a30c74bf
  name_zh: 出境人数（出境游客）
  topic_ids:
  - cnstat.commerce
  definition: 指中国（大陆）居民因公或因私出境前往其他国家、中国香港特别行政区、澳门特别行政区和台湾省观光、度假、探亲访友、就医疗养、购物、参加会议或从事经济、文化、体育、宗教活动的人数（即出境游客）。统计时，出境游客按每出境一次统计1人次。
  source_name: 国家统计局·指标解释·住宿、餐饮业和旅游
