- term_id: cnstat.term.fixed_investment.ba7231c0
  name_zh: 全社会固定资产投资
  topic_ids:
  - cnstat.investment
  definition: 是以货币形式表现的在一定时期内全社会建造和购置固定资产的工作量以及与此有关费用的总称。该指标是反映固定资产投资规模、结构和发展速度的综合性指标。全社会固定资产投资按登记注册类型可分为国有、集体、联营、股份制、私营和个体、港澳台商、外商、其他等。
  source_name: 国家统计局·指标解释·固定资产投资
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897101.html
