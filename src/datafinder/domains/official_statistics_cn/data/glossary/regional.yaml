- term_id: cnstat.term.urban_rural_regional.40f1d80e
  name_zh: 道路长度
  topic_ids:
  - cnstat.regional
  definition: 指道路长度和与道路相通的桥梁、隧道的长度，按车行道中心线计算。
  source_name: 国家统计局·指标解释·城市、农村和区域发展
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897086.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.urban_rural_regional.79ee4869
  name_zh: 城市桥梁
  topic_ids:
  - cnstat.regional
  definition: 指为跨越天然或人工障碍物而修建的构筑物。包括跨河桥、立交桥、人行天桥以及人行地下通道等。
  source_name: 国家统计局·指标解释·城市、农村和区域发展
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897086.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.urban_rural_regional.587f51fa
  name_zh: 城市排水管道长度
  topic_ids:
  - cnstat.regional
  definition: 指所有排水总管、干管、支管、检查井及连接井进出口等长度之和。
  source_name: 国家统计局·指标解释·城市、农村和区域发展
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897086.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.urban_rural_regional.6d660f8f
  name_zh: 城市污水日处理能力
  topic_ids:
  - cnstat.regional
  definition: 指污水处理厂（或污水处理装置）每昼夜处理污水量的设计能力。
  source_name: 国家统计局·指标解释·城市、农村和区域发展
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897086.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.urban_rural_regional.5fd880b4
  name_zh: 年末公共交通车辆运营数
  topic_ids:
  - cnstat.regional
  definition: 指年末城市用于公共交通运营业务的全部车辆数。新购、新制和调入的运营车辆，自投入之日起开始计算；调出、报废和调作他用的运营车辆，自上级主管机关批准之日起不再计入。
  source_name: 国家统计局·指标解释·城市、农村和区域发展
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897086.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.urban_rural_regional.46fa0a64
  name_zh: 城市绿地面积
  topic_ids:
  - cnstat.regional
  definition: 指报告期末用作园林和绿化的各种绿地面积。包括公园绿地、生产绿地、防护绿地、附属绿地和其他绿地的面积。
  source_name: 国家统计局·指标解释·城市、农村和区域发展
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897086.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.urban_rural_regional.0fe7ed88
  name_zh: 公园绿地
  topic_ids:
  - cnstat.regional
  definition: 城市中向公众开放的、以游憩为主要功能，有一定的游憩设施和服务设施，同时兼有健全生态、美化景观、防灾减灾等综合作用的绿化用地。包括综合公园、社区公园、专类公园、带状公园和街旁绿地。其中综合公园、专类公园和带状公园面积之和为公园面积。
  source_name: 国家统计局·指标解释·城市、农村和区域发展
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897086.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.urban_rural_regional.c01b4849
  name_zh: 清扫保洁面积
  topic_ids:
  - cnstat.regional
  definition: 指报告期末对城市道路和公共场所（主要包括城市行车道、人行道、车行隧道、人行过街地下通道、道路附属绿地、地铁站、高架路、人行过街天桥、立交桥、广场、停车场及其他设施等）进行清扫保洁的面积。一天清扫保洁多次的，按清扫保洁面积最大的一次计算。
  source_name: 国家统计局·指标解释·城市、农村和区域发展
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897086.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.urban_rural_regional.1246b14f
  name_zh: 市容环卫专用车辆设备
  topic_ids:
  - cnstat.regional
  definition: 指用于环境卫生作业、监察的专用车辆和设备，包括用于道路清扫、冲洗、洒水、除雪、垃圾粪便清运、市容监察以及与其配套使用的车辆和设备。
  source_name: 国家统计局·指标解释·城市、农村和区域发展
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897086.html
