  definition: 指报告期固定资产投资项目单位向银行及非银行金融机构借入用于固定资产投资的各种国内借款，包括银行利用自有资金及吸收存款发放的贷款、上级拨入的国内贷款、国家专项贷款（包括煤代油贷款、劳改煤矿专项贷款等），地方财政专项资金安排的贷款、国内储备贷款、周转贷款等。
