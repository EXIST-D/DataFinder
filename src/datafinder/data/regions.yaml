  CN-CQ: {zh: 重庆, aliases: [重庆市]}
  CN-SC: {zh: 四川, aliases: [四川省]}
  CN-GZ: {zh: 贵州, aliases: [贵州省]}
  CN-YN: {zh: 云南, aliases: [云南省]}
  CN-XZ: {zh: 西藏, aliases: [西藏自治区]}
