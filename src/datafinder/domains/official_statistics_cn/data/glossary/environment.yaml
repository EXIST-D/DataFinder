  name_zh: 造林面积
  topic_ids:
  - cnstat.environment
  definition: 指在宜林荒山荒地、宜林沙荒地、无立木林地、疏林地和退耕地等其他宜林地上通过人工措施形成或恢复森林、林木、灌木林的过程。
  source_name: 国家统计局·指标解释·资源和环境
