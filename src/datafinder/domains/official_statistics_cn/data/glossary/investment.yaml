- term_id: cnstat.term.construction.9042c87c
  name_zh: 建筑业统计单位
  topic_ids:
  - cnstat.investment
  definition: 指从事房屋、构筑物建造和设备安装活动的法人企业。建筑业法人企业应具有建筑业资质并能够独立核算，同时还应具备以下条件：①依法成立，有自己的名称、组织机构和场所，能够承担民事责任；②独立拥有和使用资产，承担负债，有权与其他单位签订合同；③独立核算盈亏，能够编制资产负债表。
  source_name: 国家统计局·指标解释·建筑业
