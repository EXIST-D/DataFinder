- term_id: cnstat.term.resources_environment.032a2ade
  name_zh: 地面塌陷
  topic_ids:
  - cnstat.environment
  definition: 指地表岩、土体在自然或人为因素作用下向下陷落，并在地面形成塌陷坑（洞）的一种动力地质现象。
  source_name: 国家统计局·指标解释·资源和环境
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897103.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.resources_environment.80936b19
  name_zh: 森林火灾次数
  topic_ids:
  - cnstat.environment
  definition: 指发生在城市市区外的一切森林、林木和林地的火灾次数。按照受害森林面积和伤亡人数，森林火灾分为一般森林火灾、较大森林火灾、重大森林火灾和特别重大森林火灾：1.一般森林火灾：受害森林面积在1公顷以下或者其他林地起火的，或者死亡1人以上3人以下的，或者重伤1人以上10人以下的；2.较大森林火灾：受害森林面积在1公顷以上100公顷以下的，或者死亡3人以上10人以下的，或者重伤10人以上50人以下的；3.重大森林火灾：受害森林面积在100公顷以上1000公顷以下的，或者死亡10人以上30人以下的，或者重伤50人以上100人以下的；4.特别重大森林火灾：受害森林面积在1000公顷以上的，或者死亡30人以上的，或者重伤100人以上的。本条所称“以上”包括本数，“以下”不包括本数。
  source_name: 国家统计局·指标解释·资源和环境
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897103.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
