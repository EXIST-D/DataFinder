  - cnstat.environment
  definition: 包括郁闭度0.2以上的乔木林地面积和竹林面积，国家特别规定的灌木林地面积，农田林网以及村旁、路旁、水旁、宅旁林木的覆盖面积。
  source_name: 国家统计局·指标解释·资源和环境
