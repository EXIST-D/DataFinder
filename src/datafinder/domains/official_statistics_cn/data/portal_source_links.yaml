# 门户—来源的人工认定（只写自动算不出的例外）。
# 自动规则：门户网址规范化后，与来源的 base_url 或首页条目网址完全一致 → same_site。
# portal_key = 门户库里门户网址规范化后的形式（去协议、去 www、去末尾斜杠，见 datafinder.util.normalize_url）。
# relation：hosted_on 来源托管在该门户的网站上 · section 该门户是来源所属网站的一个栏目/专区 · related 只作提示（不计入接入等级）
