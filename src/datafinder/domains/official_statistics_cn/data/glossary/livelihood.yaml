- term_id: cnstat.term.employment_wages.23149496
  name_zh: 劳动力
  topic_ids:
  - cnstat.livelihood
  definition: 指在16周岁及以上，有劳动能力，参加或要求参加社会经济活动的人口。包括就业人员和失业人员。
  source_name: 国家统计局·指标解释·就业和工资
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897107.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.employment_wages.f82c6014
  name_zh: 就业人员
  topic_ids:
  - cnstat.livelihood
  definition: 指在一定年龄以上，有劳动能力，为取得劳动报酬或经营收入而从事一定社会劳动的人员。具体指年满16周岁，为取得报酬或经营利润，在调查周内从事了1小时（含1小时）以上劳动的人员；或由于学习、休假等原因在调查周内暂时处于未工作状态，但有工作单位或场所的人员；或由于临时停工放假、单位不景气放假等原因在调查周内暂时处于未工作状态，但不满三个月的人员。
  source_name: 国家统计局·指标解释·就业和工资
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897107.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.employment_wages.829108b4
  name_zh: 单位就业人员
  topic_ids:
  - cnstat.livelihood
  definition: '指报告期末最后一日在本单位工作，并取得工资或其他形式劳动报酬的人员数。该指标为时点指标，不包括最后一日当天及以前已经与单位解除劳动合同关系的人员，是在岗职工、劳务派遣人员及其他就业人员之和。就业人员不包括：

    （1）离开本单位仍保留劳动关系，并定期领取生活费的人员；

    （2）在本单位实习的各类在校学生；

    （3）本单位以劳务外包形式使用的人员，如：建筑业整建制使用的人员。'
  source_name: 国家统计局·指标解释·就业和工资
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897107.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.employment_wages.aa41147b
  name_zh: 城镇私营和个体就业人员
  topic_ids:
  - cnstat.livelihood
  definition: 城镇私营就业人员指在工商管理部门注册登记，其经营地址设在县城关镇（含县城关镇）以上的私营企业就业人员，包括私营企业投资者和雇工。城镇个体就业人员指在工商管理部门注册登记，并持有城镇户口或在城镇长期居住，经批准从事个体工商经营的就业人员，包括个体经营者和在个体工商户劳动的家庭帮工和雇工。
  source_name: 国家统计局·指标解释·就业和工资
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897107.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.employment_wages.7303566f
  name_zh: 在岗职工
  topic_ids:
  - cnstat.livelihood
  definition: '指在本单位工作且与本单位签订劳动合同，并由单位支付各项工资和社会保险、住房公积金的人员，以及上述人员中由于学习、病伤、产假等原因暂未工作仍由单位支付工资的人员。在岗职工还包括：

    （1）应订立劳动合同而未订立劳动合同人员（如使用的农村户籍人员）；

    （2）处于试用期人员；

    （3）编制外招用的人员，如临时人员；

    （4）派往外单位工作，但工资仍由本单位发放的人员（如挂职锻炼、外派工作等情况）。'
  source_name: 国家统计局·指标解释·就业和工资
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897107.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.employment_wages.4c085d65
  name_zh: 工资总额
  topic_ids:
  - cnstat.livelihood
  definition: '指根据《关于工资总额组成的规定》（1990年1月1日国家统计局发布的一号令）进行修订，本单位在报告期内（季度或年度）直接支付给本单位全部就业人员的劳动报酬总额。包括计时工资、计件工资、奖金、津贴和补贴、加班加点工资、特殊情况下支付的工资，是在岗职工工资总额、劳务派遣人员工资总额和其他就业人员工资总额之和。

    工资总额是税前工资，包括单位从个人工资中直接为其代扣或代缴的房费、水费、电费、住房公积金和社会保险基金个人缴纳部分等。

    工资总额不论是计入成本的还是不计入成本的，不论是以货币形式支付的还是以实物形式支付的，均应列入工资总额的计算范围。'
  source_name: 国家统计局·指标解释·就业和工资
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897107.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
