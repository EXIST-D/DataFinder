- term_id: cnstat.term.resources_environment.643174b8
  name_zh: 飞播造林
  topic_ids:
  - cnstat.environment
  definition: 通过飞机播种，并辅以适当的人工措施，在自然力的作用下使其形成森林或灌草植被，提高森林植被覆被率或提高森林植被质量的技术措施。包括荒山飞播造林和飞播营林。
  source_name: 国家统计局·指标解释·资源和环境
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897103.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.resources_environment.f53a5abf
  name_zh: 新封山育林
  topic_ids:
  - cnstat.environment
  definition: 对宜林地、无立木林地、疏林地或低质低效有林地、灌木林地实施封禁并辅以人工促进手段，使其形成森林或灌草植被或提高林分质量的一项技术措施。包括无林地和疏林地封育以及有林地和灌木林地封育。
  source_name: 国家统计局·指标解释·资源和环境
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897103.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.resources_environment.f5105990
  name_zh: 退化林修复
  topic_ids:
  - cnstat.environment
  definition: 为改善林分的活力和结构，有效遏制防护林退化，提高林分质量和恢复森林功能，对结构失调和稳定性降低、功能退化甚至丧失且自然更新能力弱的林分采取的结构调整、树种替换、补植补播、嫁接复壮等森林经营措施。
  source_name: 国家统计局·指标解释·资源和环境
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897103.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.resources_environment.057dedf4
  name_zh: 人工更新造林
  topic_ids:
  - cnstat.environment
  definition: 指在采伐迹地、火烧迹地、林中空地上通过人工造林重新形成森林的过程。包括通过松土除草、平茬或断根复壮、补植补播、除蘖间苗等措施促进目的树种幼苗幼树生长发育的人工促进天然更新。
  source_name: 国家统计局·指标解释·资源和环境
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897103.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.resources_environment.985a05e7
  name_zh: 湿地
  topic_ids:
  - cnstat.environment
  definition: 指天然或人工、长久或暂时性的沼泽地、泥炭地或水域地带，包括静止或流动、淡水、半咸水、咸水体，低潮时水深不超过6米的水域以及海岸地带地区的珊瑚滩和海草床、滩涂、红树林、河口、河流、淡水沼泽、沼泽森林、湖泊、盐沼及盐湖。
  source_name: 国家统计局·指标解释·资源和环境
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897103.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.resources_environment.de8d3882
  name_zh: 自然保护区
  topic_ids:
  - cnstat.environment
  definition: 指为了保护自然环境和自然资源，促进国民经济的持续发展，将一定面积的陆地和水体划分出来，并经各级人民政府批准而进行特殊保护和管理的区域个数。根据保护对象，自然保护区分为自然生态系统类、野生生物类、自然遗迹类。风景名胜区、文物保护区不计在内。
  source_name: 国家统计局·指标解释·资源和环境
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897103.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.resources_environment.9d06d159
  name_zh: 滑坡
  topic_ids:
  - cnstat.environment
  definition: 指斜坡上不稳定的岩土体在重力作用下沿一定软弱面（或滑动带）整体向下滑动的物理地质现象。
  source_name: 国家统计局·指标解释·资源和环境
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897103.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.resources_environment.0ad06a3d
  name_zh: 崩塌
  topic_ids:
  - cnstat.environment
  definition: 指陡坡上大块的岩土体在重力作用下突然脱离母体崩落的物理地质现象。
  source_name: 国家统计局·指标解释·资源和环境
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897103.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.resources_environment.15cb06e3
  name_zh: 泥石流
  topic_ids:
  - cnstat.environment
  definition: 指山地突然爆发的饱含大量泥沙、石块的特殊洪流。
  source_name: 国家统计局·指标解释·资源和环境
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897103.html
  retrieved_at: '2026-11-21'
