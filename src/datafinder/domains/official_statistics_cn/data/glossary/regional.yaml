- term_id: cnstat.term.urban_rural_regional.a071de00
  name_zh: 城市供热能力
  topic_ids:
  - cnstat.regional
  definition: 指供热企业（单位）向城市热用户输送热能的设计能力。
  source_name: 国家统计局·指标解释·城市、农村和区域发展
