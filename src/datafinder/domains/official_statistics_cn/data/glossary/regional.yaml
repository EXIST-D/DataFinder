- term_id: cnstat.term.urban_rural_regional.db817239
  name_zh: 人工煤气生产能力
  topic_ids:
  - cnstat.regional
  definition: 指报告期末人工燃气生产厂制气、净化、输送等环节的综合生产能力，不包括备用设备能力。一般按设计能力计算，当实际生产能力大于设计能力时，应按实际测定的生产能力计算。测定时应以制气、净化、输送三个环节中最薄弱的环节为主。
  source_name: 国家统计局·指标解释·城市、农村和区域发展
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897086.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.urban_rural_regional.44b11dc0
  name_zh: 供气管道长度
  topic_ids:
  - cnstat.regional
  definition: 指报告期末从气源厂压缩机的出口或门站出口至各类用户引入管之间的全部已经通气、投入使用的管道长度。不包括煤气生产厂、输配站、液化气储存站、灌瓶站、储配站、气化站、混气站、供应站等厂（站）内的管道。
  source_name: 国家统计局·指标解释·城市、农村和区域发展
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897086.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.urban_rural_regional.c01a48bc
  name_zh: 城市供气总量
  topic_ids:
  - cnstat.regional
  definition: 指报告期燃气企业（单位）向用户供应的燃气数量。包括销售量和损失量。
  source_name: 国家统计局·指标解释·城市、农村和区域发展
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897086.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
