    topic: 中国县域共同富裕水平测度与时空演进
    expect:
      portals: [国家统计局]
      indicators: [[居民人均可支配收入, 可支配收入]]
      tables: [[各县, 县（市、区）, 县(市、区), 县域]]

  - id: smc-yangtze-energy-efficiency
