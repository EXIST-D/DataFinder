- term_id: cnstat.term.living.181bed09
  name_zh: 财产净收入
  topic_ids:
  - cnstat.livelihood
  definition: 指住户或住户成员将其所拥有的金融资产、住房等非金融资产和自然资源交由其他机构单位、住户或个人支配而获得的回报并扣除相关的费用之后得到的净收入。财产净收入包括利息净收入、红利收入、储蓄性保险净收益、转让承包土地经营权租金净收入、出租房屋净收入、出租其他资产净收入和自有住房折算净租金等。财产净收入不包括转让资产所有权的溢价所得。
  source_name: 国家统计局·指标解释·人民生活
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897105.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
