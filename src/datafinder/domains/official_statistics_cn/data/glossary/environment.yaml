  name_zh: 人工林面积
  topic_ids:
  - cnstat.environment
  definition: 指由人工播种、植苗或扦插造林形成的生长稳定，（一般造林3-5年后或飞机播种5-7年后）每公顷保存株数大于或等于造林设计植树株数80%或郁闭度0.20以上（含0.20）的林分面积。
  source_name: 国家统计局·指标解释·资源和环境
