<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>DataFinder · 找数据，一句话的事</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230071e3'/%3E%3Ccircle cx='14' cy='14' r='6' fill='none' stroke='white' stroke-width='2.4'/%3E%3Cpath d='M19 19l5 5' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/" aria-label="DataFinder 首页">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        DataFinder
      </a>
      <span class="nav-status" id="navStatus" aria-live="polite"></span>
    </div>
    <div class="progress" id="progress" aria-hidden="true"><span></span></div>
  </header>

  <main>
    <section class="hero" id="hero">
      <div class="hero-title">
        <div class="hero-title-inner">
          <h1>找数据，<br>一句话的事。</h1>
          <p class="sub">中文优先。一次查遍国家统计局、科研仓库与各国开放数据，<br class="wide">告诉你哪里有、怎么拿。</p>
        </div>
      </div>

      <form class="search" id="searchForm" role="search" autocomplete="off">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="q" name="q" type="search" maxlength="200" enterkeyhint="search" spellcheck="false"
               placeholder="例如：中国各省近十年人口、GDP、城镇化率" aria-label="搜索数据">
        <kbd class="kbd" aria-hidden="true">/</kbd>
        <button class="go" id="go" type="submit" aria-label="搜索" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>

      <div class="examples" id="examples" aria-label="试试这些">
        <button type="button" class="chip" data-q="中国各省近十年人口 GDP 城镇化率">人口 · GDP · 城镇化率</button>
        <button type="button" class="chip" data-q="国内生产总值">国内生产总值</button>
        <button type="button" class="chip" data-q="空气质量 PM2.5">空气质量</button>
        <button type="button" class="chip" data-q="人口普查">人口普查</button>
        <button type="button" class="chip" data-q="air quality">air quality</button>
      </div>
    </section>

    <section class="results" id="results" hidden>
      <div class="sources" id="sources" aria-live="polite"></div>
      <div class="layout">
        <div class="col-main">
          <div class="section-head">
            <h2>数据集</h2>
            <span class="count" id="count"></span>
          </div>
          <div id="datasets"></div>
        </div>
        <aside class="col-side" aria-label="相关门户">
          <div class="section-head">
            <h2>相关门户</h2>
          </div>
          <div id="portals"></div>
          <p class="note">门户目录来自 Dateno（CC BY 4.0），收录不代表已实时核验，请以原站为准。</p>
        </aside>
      </div>
      <p class="footnote" id="footnote"></p>
    </section>
  </main>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <button class="sheet-close" id="sheetClose" type="button" aria-label="关闭">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="sheet-body" id="sheetBody"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
