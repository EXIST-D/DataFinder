  name_zh: 人工造林
  topic_ids:
  - cnstat.environment
  definition: 指在宜林荒山荒地、宜林沙荒地、无立木林地、疏林地和退耕地等其他宜林地上通过播种、植苗和分植来提高森林植被覆被率的技术措施。
  source_name: 国家统计局·指标解释·资源和环境
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897103.html
