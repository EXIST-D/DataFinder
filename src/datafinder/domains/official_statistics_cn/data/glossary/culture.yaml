terms:
- term_id: cnstat.term.culture_sports.ad5471e3
  name_zh: 广播/电视节目综合人口覆盖率
  topic_ids:
  - cnstat.culture
  definition: 指根据国家广播电视总局制定的《广播电视人口覆盖率统计技术标准和方法》进行统计调查的，在对象区内能接收到由中央、省、地市或县通过无线、有线或卫星等各种技术方式转播的各级广播/电视节目的人口数占全国总人口数的百分比。
  source_name: 国家统计局·指标解释·文化和体育
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897088.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.culture_sports.2109e440
  name_zh: 艺术表演团体
  topic_ids:
  - cnstat.culture
  definition: 指由文化部门主办或实行行业管理（经文化行政部门审批或已申报登记并领取相关许可证），专门从事表演艺术等活动的各类专业艺术表演团体，含民间职业剧团。不包括群众业余文艺表演团体。
  source_name: 国家统计局·指标解释·文化和体育
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897088.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.culture_sports.1fc1e27e
  name_zh: 艺术表演场馆
  topic_ids:
  - cnstat.culture
  definition: 指由文化部门主办或实行行业管理（经文化市场行政部门审批或已申报登记并领取相关许可证），有观众席、舞台、灯光设备，公开售票、专供文艺团体演出的文化活动场所。
  source_name: 国家统计局·指标解释·文化和体育
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897088.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
- term_id: cnstat.term.culture_sports.7dd8d03f
