- term_id: cnstat.term.industry.05e56f97
  name_zh: 利润总额
  topic_ids:
  - cnstat.industry
  definition: 指企业在一定会计期间的经营成果，是生产经营过程中各种收入扣除各种耗费后的盈余，反映企业在报告期内实现的盈亏总额。来源于会计“利润表”中“利润总额”项目的本年累计数。
  source_name: 国家统计局·指标解释·工业
  source_url: https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897098.html
  retrieved_at: '2026-11-21'
  verification_status: official_sourced
