- term_id: cnstat.term.national_accounts.d923648f
  name_zh: 国际储备
  topic_ids:
  - cnstat.macro
  definition: 指我国中央银行拥有的对外资产，包括外汇、货币黄金、特别提款权、在国际货币基金组织的储备头寸。
  source_name: 国家统计局·指标解释·国民经济核算
